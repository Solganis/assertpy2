name: Consumer corpus

# The suite in `tests/` imports the source tree. This installs a build instead and checks code written
# the way a consumer writes it: a plain pytest suite, a fully annotated one at maximum strictness, the
# numpy/pandas stack, containers of somebody else's making, and the deliberately dynamic parts.
#
# It exists because the last several typing defects were found by guessing at other people's code
# rather than by running it: a selector type that refused a mapping with its own `__getitem__`, a
# `slice` that stopped type-checking on 3.10, an unparameterised `Matcher` that made every member
# "partially unknown" under pyright strict. Each was invisible from inside the repository.
#
# Not in the main gate: it builds the package and creates one environment per project, which takes
# minutes rather than seconds. It runs on a schedule, on demand, and on anything touching the typed
# surface or the packaging, which is where its findings come from.

on:
  push:
    paths:
      - "assertpy2/_engine/_typing.py"
      - "assertpy2/assertpy.py"
      - "pyproject.toml"
      - "corpus/**"
      - ".github/workflows/corpus.yml"
  pull_request:
    paths:
      - "assertpy2/_engine/_typing.py"
      - "assertpy2/assertpy.py"
      - "pyproject.toml"
      - "corpus/**"
  schedule:
    - cron: "0 5 * * 2" # weekly, Tuesday 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # both ends of the supported range, because two findings so far were version-dependent: a
        # `slice` is unhashable before 3.12, and stub differences move what a checker accepts
        include:
          - os: ubuntu-latest
            python: "3.10"
            install: wheel
          - os: ubuntu-latest
            python: "3.15"
            install: wheel
          - os: ubuntu-latest
            python: "3.14"
            install: sdist
          - os: windows-latest
            python: "3.14"
            install: wheel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the corpus
        run: python corpus/run.py --from ${{ matrix.install }} --json corpus-results.json

      - name: Publish the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.install }}
          path: corpus-results.json
          if-no-files-found: ignore
