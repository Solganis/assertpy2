name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    # mapped at job level so the upload step can ask whether it has a token before it runs: the secrets
    # context is not readable from a step `if`, and step-level env is not in scope for its own condition
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # the Codecov cell also installs every optional integration (pandas/polars/numpy extras plus
          # pydantic/attrs/requests), so the tests the other minimal-env cells skip run here for real
          - os: ubuntu-latest
            python-version: "3.14"
            full-deps: true
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        if: '!matrix.full-deps'
        run: uv sync --locked --extra json

      - name: Install dependencies (all integrations)
        if: matrix.full-deps
        run: uv sync --locked --extra json --extra data --extra inline --group integrations --group docs-examples

      - name: Test with coverage
        if: '!matrix.full-deps'
        run: uv run pytest -v --cov=assertpy2 --cov-report=term-missing --cov-report=xml --ignore=tests/test_docs_examples.py tests

      - name: Test with coverage (enforce 100%)
        # Only the full-deps cell has every integration installed and 0 skips, so it is
        # the only cell that can reach 100%. This is the hard local gate; Codecov's status
        # is reporting on top, not the sole guard (it uploads async and can fail open).
        # The doc-example guard is excluded here so its runs never pad the coverage number.
        if: matrix.full-deps
        run: uv run pytest -v --cov=assertpy2 --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --ignore=tests/test_docs_examples.py tests

      - name: Guard doc examples
        # Runs once (docs are platform-independent) and without coverage, so executing the
        # README/guide snippets can't mask a real coverage gap in the test suite.
        if: matrix.full-deps
        run: uv run pytest tests/test_docs_examples.py

      - name: Upload coverage to Codecov
        # Only the full-deps cell. The bare 3.14/ubuntu cell skips every integration test and used
        # to upload too: Codecov merges reports so the number stayed right, but one of the two was
        # always a partial report sent at a 100% target.
        # A run without repository secrets gets an empty token, and Codecov rejects an untokened upload
        # to a protected branch, so the job went red on the upload while every test passed.  The gate is
        # the token rather than who opened the pull request: dependabot pushes its branches into this
        # repository, so a fork test reads false for it and it still runs without secrets.
        if: matrix.full-deps && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A failed upload is a broken report, not a passing build. The 100% gate above is the hard
          # guard either way, so this cannot turn a real coverage drop into a green run.
          fail_ci_if_error: true

  optional-integrations:
    # allure and behave get their own job because installing them is incompatible with the coverage
    # gate: with allure present the `except ImportError` fallback in pytest_plugin.py never runs, and
    # without it the import itself never runs. The gating cell keeps the second state, this one holds
    # the first. Everywhere else the two are tested against mocks, which accept any call and would
    # wave through the renamed parameter or moved attribute a Dependabot bump can bring.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --extra json --extra allure --extra behave

      - name: Contract tests against the real libraries
        run: uv run pytest -v tests/test_optional_integration_contracts.py

      - name: The rest of the suite must also pass with both installed
        # Installing allure flips `_HAS_ALLURE`, so every failing assertion in the suite takes the
        # real attach path. That must not change any other test's outcome.
        run: uv run pytest -q --ignore=tests/test_docs_examples.py tests

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        # the whole `data` stack, because the overloads narrow on *structure* and the structures are
        # pandas', polars' and numpy's to change. A stub release that stops declaring the member a
        # shape keys on moves those values back to the generic builder, silently: it type-checks, and
        # the narrowed methods just stop being offered. The integration matrix below is what notices
        run: uv sync --locked --extra json --extra data --extra inline --group typecheck --group integrations

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check assertpy2/ tests/test_typing.py

      - name: Type check (mypy --strict, public typing surface)
        run: uv run mypy --strict --follow-imports=silent tests/test_typing.py

      - name: Type check (pyright, public typing surface)
        run: uv run pyright --pythonversion 3.14 tests/test_typing.py

      # the package itself carries diagnostics that are not defects (values typed `object`, guarded
      # optional imports, deliberate overloads). They are recorded per rule with a reason, so a new
      # one fails here instead of hiding in a count nobody reads.
      - name: Type check (pyright, package baseline)
        run: uv run pytest tests/test_pyright_baseline.py -q

      # the outside view of the same package: what a user of the installed wheel can see a type for.
      # A package checks clean and still hands out `Unknown` on a public method, which is a different
      # defect and needs its own gate
      - name: Type check (pyright, completeness of the exported surface)
        run: uv run pytest tests/test_typing_completeness.py -q

      # the other direction: which incompatible operands the checkers actually refuse. Recorded per
      # relation, so tightening a signature shows up here as a deliberate change rather than as a
      # number, and loosening one shows up at all
      - name: Type check (rejections, all three checkers)
        run: uv run pytest tests/test_typing_negative.py -q

      # the stand-in classes in `test_typing.py` prove the overloads are written correctly and cannot
      # prove the real libraries still match them. This runs the same question against real pandas,
      # polars and numpy values, with each checker given its interpreter and target explicitly
      - name: Type check (real library values, all three checkers)
        run: uv run pytest tests/test_typing_integrations.py -q

      # an ASGI or a WSGI response is a callable, so which overload claims one is decided by the order
      # of the two. Two clients were reaching the callable view and refusing their own assertions, and
      # only a real response says whether a client still matches the capability that describes it
      - name: Type check (real HTTP responses, all three checkers)
        run: uv run pytest tests/test_typing_http.py -q

      # every gate above reads the working tree, where `py.typed` and every subpackage are present
      # because they are files on disk. A consumer gets the wheel, and the two agree only for as long
      # as the packaging says so
      - name: Type check (the typed surface as an installed wheel carries it)
        run: uv run pytest tests/test_typing_from_a_wheel.py -q

      # the verdict twins are generated from the protocols; this is where an edit to the generated
      # file, or a protocol change the twins did not follow, stops being invisible
      - name: Type check (the generated verdict twins are in step)
        run: uv run pytest tests/test_check_protocols.py tests/test_operation_contract.py -q

      # the two halves of every signature: the runtime and the type it is described by. Parity asks
      # whether a declared method exists; this asks whether the two agree about its parameters, how
      # they may be passed, and which of them are required
      - name: Type check (the runtime and the typed surface agree, parameter by parameter)
        run: uv run pytest tests/test_typing_conformance.py -q

  ci-ok:
    timeout-minutes: 5
    needs: [test, optional-integrations, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATIONS_RESULT: ${{ needs.optional-integrations.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          [ "$TEST_RESULT" = "success" ] &&
          [ "$INTEGRATIONS_RESULT" = "success" ] &&
          [ "$LINT_RESULT" = "success" ]
