name: CodSpeed

# Continuous performance gate: run the micro-benchmarks (benchmarks/test_perf.py) under CodSpeed's CPU
# simulation, which measures a deterministic instruction count rather than wall time, so a runner's noise
# never flakes it. CodSpeed compares each commit to the base and reports a pass/fail on the PR. A public
# repo uploads over OIDC (id-token), so no token secret is needed - only the CodSpeed GitHub App installed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmarks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned, because the gate compares one commit to the next and nothing else should move between
      # them. Left to resolve, `uv run` takes whatever interpreter the runner image happens to carry,
      # and a change there shifts every benchmark at once. 3.14 is the release the rest of CI already
      # standardises on; a beta is the wrong choice here, since every beta build moves the numbers.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"

      - name: Run benchmarks under CodSpeed
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: simulation
          run: uv run --locked --group benchmark pytest benchmarks/ --codspeed --no-cov
